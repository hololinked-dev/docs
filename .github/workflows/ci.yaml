name: deploy-docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # repository_dispatch:
  #   types: [trigger-downstream]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MODULE: docs

jobs:
  build:
    name: build & sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the repo submodule
        run: git submodule update --init --depth 1 repo/hololinked

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: "v2.2.4"

      - name: Install Skaffold
        run: |
          set -euo pipefail
          curl -L "https://storage.googleapis.com/skaffold/releases/v2.16.1/skaffold-linux-amd64" -o skaffold
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin/skaffold

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --push=false overrides local.push in skaffold.yaml, which would otherwise push anyway
      # and overwrite the constant :prod tag with a pull request build.
      - name: Build with Skaffold (validate only)
        if: github.event_name == 'pull_request'
        run: |
          skaffold build \
            --default-repo=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --push=false \
            -m ${{ env.MODULE }}

      - name: Build with Skaffold (push)
        if: github.event_name != 'pull_request'
        run: |
          skaffold build \
            --default-repo=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --push \
            --file-output build.out.json \
            -m ${{ env.MODULE }}

      - name: Cosign sign images
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          jq -r '.builds[].tag' build.out.json | while read -r REF; do
            echo "Signing $REF"
            cosign sign --yes "$REF"
          done

      - name: Upload build output
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: build-out
          path: build.out.json
          retention-days: 1

  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Skaffold
        run: |
          set -euo pipefail
          curl -L "https://storage.googleapis.com/skaffold/releases/v2.16.1/skaffold-linux-amd64" -o skaffold
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin/skaffold

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-out

      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          echo "${KUBECONFIG_B64}" | base64 -d > ~/.kube/config

      - name: Deploy with Skaffold
        run: |
          skaffold deploy \
            --default-repo=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --build-artifacts build.out.json \
            -m ${{ env.MODULE }}

  httproute:
    name: apply httproute
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          echo "${KUBECONFIG_B64}" | base64 -d > ~/.kube/config

      - name: Apply HTTPRoute
        run: |
          set -euo pipefail
          kubectl apply --dry-run=server -f deployment/httproute.yaml -n website
          kubectl apply -f deployment/httproute.yaml -n website

      - name: Wait for route to be accepted
        run: |
          set -euo pipefail
          for route in docs docs-redirect; do
            for cond in Accepted ResolvedRefs; do
              kubectl wait --timeout=60s -n website "httproute/$route" \
                --for=jsonpath="{.status.parents[0].conditions[?(@.type==\"$cond\")].status}"=True
            done
          done
